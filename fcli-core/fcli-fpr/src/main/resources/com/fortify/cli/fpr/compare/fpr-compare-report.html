<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPR Comparison Report</title>
<style>
:root {
  --green: #2e7d32;
  --green-bg: #e8f5e9;
  --red: #c62828;
  --red-bg: #ffebee;
  --blue: #1565c0;
  --blue-bg: #e3f2fd;
  --gray: #616161;
  --gray-bg: #f5f5f5;
  --orange: #ef6c00;
  --orange-bg: #fff3e0;
  --border: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #212121; background: #fafafa; line-height: 1.5; padding: 24px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 4px; }
h2 { font-size: 1.15rem; margin-bottom: 12px; color: #333; }
.subtitle { color: #757575; font-size: 0.85rem; margin-bottom: 24px; }
.section { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
.section-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.meta-card { background: var(--gray-bg); border-radius: 6px; padding: 12px; }
.meta-card h3 { font-size: 0.8rem; text-transform: uppercase; color: #757575; margin-bottom: 8px; letter-spacing: 0.5px; }
.meta-card .field { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 2px 0; }
.meta-card .field .label { color: #757575; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-gray { background: var(--gray-bg); color: var(--gray); }
.badge-blue { background: var(--blue-bg); color: var(--blue); }
.badge-orange { background: var(--orange-bg); color: var(--orange); }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.8rem; }
.tag-green { background: var(--green-bg); color: var(--green); }
.tag-red { background: var(--red-bg); color: var(--red); }
.tag-gray { background: var(--gray-bg); color: var(--gray); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; }
th { background: var(--gray-bg); font-weight: 600; color: #555; }
tr.row-added { background: var(--green-bg); }
tr.row-removed { background: var(--red-bg); }
tr.row-changed { background: var(--orange-bg); }
.prop-table th:nth-child(1) { width: 30%; }
.prop-table th:nth-child(2), .prop-table th:nth-child(3) { width: 28%; }
.prop-table th:nth-child(4) { width: 14%; }
.prop-table td { word-break: break-all; }
.summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
.summary-card { background: var(--gray-bg); border-radius: 6px; padding: 14px; text-align: center; }
.summary-card .value { font-size: 1.6rem; font-weight: 700; }
.summary-card .label { font-size: 0.75rem; color: #757575; text-transform: uppercase; margin-top: 2px; }
.summary-card.card-green { background: var(--green-bg); }
.summary-card.card-green .value { color: var(--green); }
.summary-card.card-red { background: var(--red-bg); }
.summary-card.card-red .value { color: var(--red); }
.summary-card.card-blue { background: var(--blue-bg); }
.summary-card.card-blue .value { color: var(--blue); }
.bar-chart { margin-top: 8px; }
.bar-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 0.8rem; }
.bar-label { width: 220px; min-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; text-align: right; }
.bar-track { flex: 1; display: flex; height: 20px; border-radius: 3px; overflow: hidden; background: #eee; }
.bar-seg { height: 100%; min-width: 0; transition: width 0.3s; }
.bar-seg-baseline { background: var(--blue); opacity: 0.5; }
.bar-seg-new { background: var(--green); }
.bar-seg-removed { background: var(--red); }
.bar-values { width: 160px; min-width: 160px; font-size: 0.75rem; color: #757575; padding-left: 8px; display: flex; gap: 6px; }
.delta { font-weight: 600; }
.delta-pos { color: var(--green); }
.delta-neg { color: var(--red); }
.delta-zero { color: var(--gray); }
.cmd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cmd-col h4 { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
.cmd-list { font-family: monospace; font-size: 0.82rem; background: var(--gray-bg); padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
.cmd-list div { padding: 1px 0; }
.cmd-added { color: var(--green); font-weight: 600; }
.cmd-removed { color: var(--red); font-weight: 600; }
.vuln-table-wrapper { max-height: 400px; overflow-y: auto; }
.vuln-table { table-layout: auto; }
.vuln-table th, .vuln-table td { overflow: visible; white-space: normal; word-break: break-all; }
.collapsible { cursor: pointer; user-select: none; }
.collapsible::before { content: "\25B6 "; font-size: 0.7rem; display: inline-block; transition: transform 0.2s; }
.collapsible.open::before { transform: rotate(90deg); }
.collapsible-content { display: none; }
.collapsible-content.open { display: block; }
.empty-msg { color: #999; font-style: italic; font-size: 0.85rem; }
</style>
</head>
<body>

<h1>FPR Comparison Report</h1>
<div class="subtitle" id="reportSubtitle"></div>

<div class="section" id="metadataSection">
  <div class="section-title">Scan Metadata</div>
  <div class="meta-grid" id="metadataGrid"></div>
</div>

<div class="section" id="engineSection">
  <div class="section-title">Engine Version</div>
  <div id="engineContent"></div>
</div>

<div class="section" id="rulePacksSection">
  <div class="section-title">Rule Packs</div>
  <div id="rulePacksContent"></div>
</div>

<div class="section" id="commandLineSection">
  <div class="section-title collapsible" onclick="toggle(this)">Command Line Arguments</div>
  <div class="collapsible-content" id="commandLineContent"></div>
</div>

<div class="section" id="propertiesSection">
  <div class="section-title collapsible" onclick="toggle(this)">Properties</div>
  <div class="collapsible-content" id="propertiesContent"></div>
</div>

<div class="section" id="filesSection">
  <div class="section-title">Source Files</div>
  <div id="filesContent"></div>
</div>

<div class="section" id="locSection">
  <div class="section-title">Lines of Code</div>
  <div id="locContent"></div>
</div>

<div class="section" id="errorsSection">
  <div class="section-title collapsible" onclick="toggle(this)">Errors</div>
  <div class="collapsible-content" id="errorsContent"></div>
</div>

<div class="section" id="vulnSummarySection">
  <div class="section-title">Vulnerability Summary</div>
  <div id="vulnSummaryContent"></div>
</div>

<div class="section" id="catChartSection">
  <div class="section-title">Vulnerabilities by Category</div>
  <div id="catChartContent"></div>
</div>

<div class="section" id="newVulnsSection">
  <div class="section-title collapsible" onclick="toggle(this)">New Vulnerabilities</div>
  <div class="collapsible-content" id="newVulnsContent"></div>
</div>

<div class="section" id="removedVulnsSection">
  <div class="section-title collapsible" onclick="toggle(this)">Removed Vulnerabilities</div>
  <div class="collapsible-content" id="removedVulnsContent"></div>
</div>

<script>
var DATA = /*DATA_PLACEHOLDER*/;

function toggle(el) {
  el.classList.toggle("open");
  var content = el.nextElementSibling;
  if (content) content.classList.toggle("open");
}

function esc(s) {
  if (s == null) return "";
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(String(s)));
  return d.innerHTML;
}

function deltaSpan(val) {
  if (val > 0) return '<span class="delta delta-pos">+' + val + '</span>';
  if (val < 0) return '<span class="delta delta-neg">' + val + '</span>';
  return '<span class="delta delta-zero">0</span>';
}

function buildMetaCard(title, info) {
  return '<div class="meta-card"><h3>' + esc(title) + '</h3>'
    + '<div class="field"><span class="label">File</span><span>' + esc(info.file) + '</span></div>'
    + '<div class="field"><span class="label">Project</span><span>' + esc(info.project) + '</span></div>'
    + '<div class="field"><span class="label">Version</span><span>' + esc(info.version) + '</span></div>'
    + '<div class="field"><span class="label">Build ID</span><span>' + esc(info.buildId) + '</span></div>'
    + (info.scanDate ? '<div class="field"><span class="label">Scan Date</span><span>' + esc(info.scanDate) + '</span></div>' : '')
    + (info.scanTime ? '<div class="field"><span class="label">Scan Duration</span><span>' + esc(info.scanTime) + 's</span></div>' : '')
    + '</div>';
}

function renderTagList(arr, cls) {
  if (!arr || arr.length === 0) return '<span class="empty-msg">None</span>';
  return '<div class="tag-list">' + arr.map(function(t) { return '<span class="tag ' + cls + '">' + esc(t) + '</span>'; }).join("") + '</div>';
}

function reasonBadge(reason) {
  if (reason === "file_added") return '<span class="badge badge-blue">File Added</span>';
  if (reason === "file_removed") return '<span class="badge badge-blue">File Removed</span>';
  if (reason === "fixed") return '<span class="badge badge-green">Fixed</span>';
  if (reason === "new") return '<span class="badge badge-orange">New</span>';
  return '';
}

function renderVulnTable(vulns) {
  if (!vulns || vulns.length === 0) return '<span class="empty-msg">None</span>';
  var h = '<div class="vuln-table-wrapper"><table class="vuln-table"><thead><tr><th>Instance ID</th><th>Category</th><th>Sink</th><th>Severity</th><th>Reason</th></tr></thead><tbody>';
  vulns.forEach(function(v) {
    h += '<tr><td>' + esc(v.instanceID) + '</td><td>' + esc(v.category) + '</td><td>' + esc(v.sink) + '</td><td>' + (v.severity != null ? v.severity.toFixed(1) : "") + '</td><td>' + reasonBadge(v.reason) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function renderCmdColumn(title, args, diffSet, diffClass) {
  var h = '<div class="cmd-col"><h4>' + esc(title) + '</h4><div class="cmd-list">';
  (args || []).forEach(function(a) {
    if (diffSet[a]) h += '<div class="' + diffClass + '">' + esc(a) + '</div>';
    else h += '<div>' + esc(a) + '</div>';
  });
  h += '</div></div>';
  return h;
}

function render() {
  if (!DATA) { document.body.innerHTML = '<p>No data available.</p>'; return; }

  // Subtitle
  var m = DATA.metadata || {};
  document.getElementById("reportSubtitle").textContent =
    (m.baseline ? m.baseline.file : "?") + "  vs  " + (m.comparison ? m.comparison.file : "?");

  // Metadata
  var grid = document.getElementById("metadataGrid");
  grid.innerHTML = buildMetaCard("Baseline", m.baseline || {}) + buildMetaCard("Comparison", m.comparison || {});

  // Engine
  var eng = DATA.engine || {};
  var engHtml = '<span>' + esc(eng.baselineVersion) + ' &rarr; ' + esc(eng.comparisonVersion) + ' </span>';
  engHtml += eng.changed ? '<span class="badge badge-red">Changed</span>' : '<span class="badge badge-green">Unchanged</span>';
  document.getElementById("engineContent").innerHTML = engHtml;

  // Rule Packs
  var rp = DATA.rulePacks || {};
  var rpHtml = '';
  if (rp.added && rp.added.length) rpHtml += '<div style="margin-bottom:8px"><strong>Added:</strong> ' + renderTagList(rp.added, "tag-green") + '</div>';
  if (rp.removed && rp.removed.length) rpHtml += '<div style="margin-bottom:8px"><strong>Removed:</strong> ' + renderTagList(rp.removed, "tag-red") + '</div>';
  rpHtml += '<div><strong>Common:</strong> ' + renderTagList(rp.common, "tag-gray") + '</div>';
  if (!rpHtml) rpHtml = '<span class="empty-msg">No rule pack data</span>';
  document.getElementById("rulePacksContent").innerHTML = rpHtml;

  // Command Line - two columns
  var cmd = DATA.commandLine || {};
  var removedSet = {};
  var addedSet = {};
  (cmd.removed || []).forEach(function(a) { removedSet[a] = true; });
  (cmd.added || []).forEach(function(a) { addedSet[a] = true; });
  var cmdHtml = '<div class="cmd-grid">'
    + renderCmdColumn("Baseline", cmd.baseline, removedSet, "cmd-removed")
    + renderCmdColumn("Comparison", cmd.comparison, addedSet, "cmd-added")
    + '</div>';
  document.getElementById("commandLineContent").innerHTML = cmdHtml;

  // Properties - constrained table
  var props = DATA.properties || {};
  var propHtml = '<table class="prop-table"><thead><tr><th>Property</th><th>Baseline</th><th>Comparison</th><th>Status</th></tr></thead><tbody>';
  var hasRows = false;
  if (props.added) Object.keys(props.added).forEach(function(k) {
    hasRows = true;
    propHtml += '<tr class="row-added"><td title="' + esc(k) + '">' + esc(k) + '</td><td></td><td title="' + esc(props.added[k]) + '">' + esc(props.added[k]) + '</td><td><span class="badge badge-green">Added</span></td></tr>';
  });
  if (props.removed) Object.keys(props.removed).forEach(function(k) {
    hasRows = true;
    propHtml += '<tr class="row-removed"><td title="' + esc(k) + '">' + esc(k) + '</td><td title="' + esc(props.removed[k]) + '">' + esc(props.removed[k]) + '</td><td></td><td><span class="badge badge-red">Removed</span></td></tr>';
  });
  if (props.changed) Object.keys(props.changed).forEach(function(k) {
    hasRows = true;
    var c = props.changed[k];
    propHtml += '<tr class="row-changed"><td title="' + esc(k) + '">' + esc(k) + '</td><td title="' + esc(c.baseline) + '">' + esc(c.baseline) + '</td><td title="' + esc(c.comparison) + '">' + esc(c.comparison) + '</td><td><span class="badge badge-orange">Changed</span></td></tr>';
  });
  if (props.common) Object.keys(props.common).forEach(function(k) {
    hasRows = true;
    propHtml += '<tr><td title="' + esc(k) + '">' + esc(k) + '</td><td colspan="2" title="' + esc(props.common[k]) + '">' + esc(props.common[k]) + '</td><td><span class="badge badge-gray">Unchanged</span></td></tr>';
  });
  propHtml += '</tbody></table>';
  document.getElementById("propertiesContent").innerHTML = hasRows ? propHtml : '<span class="empty-msg">No properties</span>';

  // Files
  var files = DATA.files || {};
  var filesHtml = '<div class="summary-cards">'
    + '<div class="summary-card"><div class="value">' + (files.baselineCount || 0) + '</div><div class="label">Baseline</div></div>'
    + '<div class="summary-card"><div class="value">' + (files.comparisonCount || 0) + '</div><div class="label">Comparison</div></div>'
    + '<div class="summary-card card-green"><div class="value">' + (files.added ? files.added.length : 0) + '</div><div class="label">Added</div></div>'
    + '<div class="summary-card card-red"><div class="value">' + (files.removed ? files.removed.length : 0) + '</div><div class="label">Removed</div></div>'
    + '</div>';
  if (files.added && files.added.length) filesHtml += '<div style="margin-bottom:8px"><strong>Added:</strong> ' + renderTagList(files.added, "tag-green") + '</div>';
  if (files.removed && files.removed.length) filesHtml += '<div><strong>Removed:</strong> ' + renderTagList(files.removed, "tag-red") + '</div>';
  document.getElementById("filesContent").innerHTML = filesHtml;

  // LOC
  var loc = DATA.loc || {};
  var locHtml = '<div style="font-size:0.9rem">'
    + 'Baseline: <strong>' + (loc.baseline || 0).toLocaleString() + '</strong> &rarr; '
    + 'Comparison: <strong>' + (loc.comparison || 0).toLocaleString() + '</strong> '
    + '(delta: ' + deltaSpan(loc.delta || 0) + ')</div>';
  document.getElementById("locContent").innerHTML = locHtml;

  // Errors
  var errs = DATA.errors || {};
  var errHtml = '';
  if (errs.added && errs.added.length) {
    errHtml += '<div style="margin-bottom:8px"><strong>New Errors:</strong></div><table><thead><tr><th>Code</th><th>Message</th></tr></thead><tbody>';
    errs.added.forEach(function(e) { errHtml += '<tr class="row-added"><td>' + esc(e.code) + '</td><td>' + esc(e.message) + '</td></tr>'; });
    errHtml += '</tbody></table>';
  }
  if (errs.removed && errs.removed.length) {
    errHtml += '<div style="margin:8px 0"><strong>Resolved Errors:</strong></div><table><thead><tr><th>Code</th><th>Message</th></tr></thead><tbody>';
    errs.removed.forEach(function(e) { errHtml += '<tr class="row-removed"><td>' + esc(e.code) + '</td><td>' + esc(e.message) + '</td></tr>'; });
    errHtml += '</tbody></table>';
  }
  if (!errHtml) errHtml = '<span class="empty-msg">No error differences</span>';
  document.getElementById("errorsContent").innerHTML = errHtml;

  // Vulnerability Summary
  var vulns = DATA.vulnerabilities || {};
  var newVulns = vulns["new"] || [];
  var removedVulns = vulns.removed || [];
  var newCount = newVulns.length;
  var removedCount = removedVulns.length;

  // Correlation counts
  var newFromAddedFiles = 0, newInExisting = 0;
  newVulns.forEach(function(v) { if (v.reason === "file_added") newFromAddedFiles++; else newInExisting++; });
  var removedFromFiles = 0, removedFixed = 0;
  removedVulns.forEach(function(v) { if (v.reason === "file_removed") removedFromFiles++; else removedFixed++; });

  var vsHtml = '<div class="summary-cards">'
    + '<div class="summary-card"><div class="value">' + (vulns.baselineTotal || 0) + '</div><div class="label">Baseline Total</div></div>'
    + '<div class="summary-card"><div class="value">' + (vulns.comparisonTotal || 0) + '</div><div class="label">Comparison Total</div></div>'
    + '<div class="summary-card card-green"><div class="value">' + newCount + '</div><div class="label">New</div></div>'
    + '<div class="summary-card card-red"><div class="value">' + removedCount + '</div><div class="label">Removed</div></div>'
    + '<div class="summary-card card-blue"><div class="value">' + (vulns.common || 0) + '</div><div class="label">Common</div></div>'
    + '</div>';

  // Correlation breakdown
  if (newCount > 0 || removedCount > 0) {
    vsHtml += '<div style="margin-top:12px; font-size:0.85rem;">';
    if (newCount > 0) {
      vsHtml += '<div style="margin-bottom:6px"><strong>New vulnerabilities:</strong> '
        + '<span class="badge badge-orange">' + newInExisting + ' in existing files</span> ';
      if (newFromAddedFiles > 0) vsHtml += '<span class="badge badge-blue">' + newFromAddedFiles + ' from added files</span>';
      vsHtml += '</div>';
    }
    if (removedCount > 0) {
      vsHtml += '<div><strong>Removed vulnerabilities:</strong> '
        + '<span class="badge badge-green">' + removedFixed + ' fixed in existing files</span> ';
      if (removedFromFiles > 0) vsHtml += '<span class="badge badge-blue">' + removedFromFiles + ' from removed files</span>';
      vsHtml += '</div>';
    }
    vsHtml += '</div>';
  }

  document.getElementById("vulnSummaryContent").innerHTML = vsHtml;

  // Category bar chart
  var cats = vulns.categorySummary || {};
  var catKeys = Object.keys(cats);
  if (catKeys.length === 0) {
    document.getElementById("catChartContent").innerHTML = '<span class="empty-msg">No category data</span>';
  } else {
    var maxVal = 0;
    catKeys.forEach(function(k) {
      var c = cats[k];
      var v = Math.max(c.baseline || 0, c.comparison || 0);
      if (v > maxVal) maxVal = v;
    });
    if (maxVal === 0) maxVal = 1;
    var chartHtml = '<div class="bar-chart">';
    catKeys.forEach(function(k) {
      var c = cats[k];
      var bw = ((c.baseline || 0) / maxVal * 100).toFixed(1);
      var nw = ((c["new"] || 0) / maxVal * 100).toFixed(1);
      var rw = ((c.removed || 0) / maxVal * 100).toFixed(1);
      chartHtml += '<div class="bar-row">'
        + '<div class="bar-label" title="' + esc(k) + '">' + esc(k) + '</div>'
        + '<div class="bar-track">'
        + '<div class="bar-seg bar-seg-baseline" style="width:' + bw + '%"></div>'
        + '<div class="bar-seg bar-seg-new" style="width:' + nw + '%"></div>'
        + '<div class="bar-seg bar-seg-removed" style="width:' + rw + '%"></div>'
        + '</div>'
        + '<div class="bar-values">'
        + '<span>B:' + (c.baseline || 0) + '</span>'
        + '<span>C:' + (c.comparison || 0) + '</span>'
        + '<span style="color:var(--green)">+' + (c["new"] || 0) + '</span>'
        + '<span style="color:var(--red)">-' + (c.removed || 0) + '</span>'
        + '</div></div>';
    });
    chartHtml += '</div>';
    document.getElementById("catChartContent").innerHTML = chartHtml;
  }

  // New Vulnerabilities
  var nvTitle = document.querySelector("#newVulnsSection .section-title");
  nvTitle.textContent = "New Vulnerabilities (" + newCount + ")";
  document.getElementById("newVulnsContent").innerHTML = renderVulnTable(vulns["new"]);

  // Removed Vulnerabilities
  var rvTitle = document.querySelector("#removedVulnsSection .section-title");
  rvTitle.textContent = "Removed Vulnerabilities (" + removedCount + ")";
  document.getElementById("removedVulnsContent").innerHTML = renderVulnTable(vulns.removed);
}

render();
</script>
</body>
</html>
